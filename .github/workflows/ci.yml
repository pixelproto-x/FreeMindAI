name: FreeMind AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Compile Python files
        run: python -m compileall -q freemind main.py scripts tests
      - name: Check frontend JavaScript syntax
        run: node --check static/app.js
      - name: Run tests
        run: python -m pytest -q
      - name: Build Docker image
        run: docker build --tag freemind-ai:ci .
      - name: Smoke-test production container authentication
        shell: bash
        run: |
          set -euo pipefail
          password='繁體中文密碼🔐é'
          token="$(printf '%s' "$password" | base64 -w0)"
          wrong_token="$(printf '%s' '錯誤密碼' | base64 -w0)"
          docker run --rm --detach --name freemind-auth-smoke \
            --publish 127.0.0.1:18080:8080 \
            --env "APP_PASSWORD=$password" \
            freemind-ai:ci
          trap 'docker rm -f freemind-auth-smoke >/dev/null 2>&1 || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:18080/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1

          unauthenticated_status="$(curl --silent --show-error -o /tmp/freemind-no-auth.json -w '%{http_code}' http://127.0.0.1:18080/api/providers)"
          test "$unauthenticated_status" = 401
          wrong_status="$(curl --silent --show-error -o /tmp/freemind-wrong-auth.json -w '%{http_code}' \
            -H "Authorization: Bearer-UTF8 $wrong_token" http://127.0.0.1:18080/api/providers)"
          test "$wrong_status" = 401
          authorized_status="$(curl --silent --show-error -o /tmp/freemind-authorized.json -w '%{http_code}' \
            -H "Authorization: Bearer-UTF8 $token" http://127.0.0.1:18080/api/providers)"
          test "$authorized_status" = 200
          conversation_status="$(curl --silent --show-error -o /tmp/freemind-conversations.json -w '%{http_code}' \
            -H "Authorization: Bearer-UTF8 $token" http://127.0.0.1:18080/api/conversations)"
          test "$conversation_status" = 200
          echo "Production-container smoke test passed: health=200, missing/wrong password=401, UTF-8 password providers/conversations=200."

  windows-launcher:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    env:
      ENVIRONMENT: production
      APP_PASSWORD: "繁體中文密碼🔐é"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare an isolated local project
        shell: pwsh
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git switch --force-create main "$env:GITHUB_SHA"
          python -m venv .venv
          [System.IO.File]::WriteAllText((Join-Path $PWD '.env'), '')
      - name: Start via run.bat and verify password-protected APIs
        shell: pwsh
        timeout-minutes: 8
        run: |
          $stdoutLog = Join-Path $PWD 'launcher-test.stdout.log'
          $stderrLog = Join-Path $PWD 'launcher-test.stderr.log'
          $process = Start-Process -FilePath $env:ComSpec -ArgumentList @('/d', '/c', 'run.bat') -WorkingDirectory $PWD -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog -PassThru -WindowStyle Hidden
          try {
            $deadline = (Get-Date).AddMinutes(6)
            $healthy = $false
            while ((Get-Date) -lt $deadline) {
              $process.Refresh()
              if ($process.HasExited) {
                throw "run.bat exited before the server became healthy (exit code $($process.ExitCode))."
              }
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8080/api/health' -TimeoutSec 2
                if ($health.status -eq 'ok') { $healthy = $true; break }
              } catch {}
              Start-Sleep -Seconds 2
            }
            if (-not $healthy) { throw 'run.bat did not become healthy within six minutes.' }

            $password = $env:APP_PASSWORD
            $token = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($password))
            $wrongToken = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('錯誤密碼'))
            $unauthenticated = (& curl.exe --silent --show-error --output NUL --write-out '%{http_code}' 'http://127.0.0.1:8080/api/providers').Trim()
            $wrong = (& curl.exe --silent --show-error --output NUL --write-out '%{http_code}' --header "Authorization: Bearer-UTF8 $wrongToken" 'http://127.0.0.1:8080/api/providers').Trim()
            $authorized = (& curl.exe --silent --show-error --output NUL --write-out '%{http_code}' --header "Authorization: Bearer-UTF8 $token" 'http://127.0.0.1:8080/api/providers').Trim()
            $conversations = (& curl.exe --silent --show-error --output NUL --write-out '%{http_code}' --header "Authorization: Bearer-UTF8 $token" 'http://127.0.0.1:8080/api/conversations').Trim()

            if ($unauthenticated -ne '401') { throw "Missing password must return 401; got $unauthenticated." }
            if ($wrong -ne '401') { throw "Wrong password must return 401; got $wrong." }
            if ($authorized -ne '200') { throw "Correct UTF-8 password must return 200 for /api/providers; got $authorized." }
            if ($conversations -ne '200') { throw "Correct UTF-8 password must return 200 for /api/conversations; got $conversations." }
            Write-Host 'Windows launcher smoke test passed: run.bat updated, started the server, rejected missing/wrong passwords, and accepted the UTF-8 password.'
          } finally {
            & taskkill.exe /PID $process.Id /T /F 2>$null | Out-Null
          }

